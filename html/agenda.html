<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda | Boralá Tche</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .cal-header { display:flex; justify-content:space-between; align-items:center; padding: 16px 20px; }
  .cal-header button { background:none; color:var(--cuia); font-size:1.2rem; }
  #avisoAgenda { display:none; margin: 0 20px 12px; padding: 12px 14px; background: var(--verde-mate-2); color: var(--cuia-suave); border-radius: var(--raio-pequeno); font-size: .88rem; }
  #gridDias { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:0 20px; text-align:center; }
  #gridDias div { padding:10px 0; border-radius:8px; background:var(--verde-mate-2); cursor:pointer; }
  .dia-disponivel { outline: 2px solid var(--dourado-mate); }
  .dia-ocupado { background: var(--coral-quero) !important; color:white; }
  .dia-ativo { outline: 3px solid var(--cuia) !important; }
  .dia-passado { opacity: .4; }
  #listaHorarios { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; padding:16px 20px 100px; }
  .horario-item { background:var(--cuia); color:var(--grafite); text-align:center; padding:8px 0; border-radius:8px; font-family:var(--fonte-dado); font-size:.85rem; }
  .indisponivel { background:var(--coral-quero); color:white; cursor:pointer; }
  .livre-agendavel { cursor:pointer; border: 2px dashed var(--dourado-mate); font-weight:600; }
  .livre-agendavel:hover { background: var(--dourado-mate); color: var(--verde-mate); }
  .passado { opacity: .35; }
  .hidden { display:none; }
  #modalAgendamento { position:fixed; inset:0; background:rgba(31,51,41,.85); display:none; align-items:center; justify-content:center; z-index:10; }
  #modalAgendamento:not(.hidden) { display:flex; }
  #modalBody { background:var(--cuia); color:var(--grafite); padding:24px; border-radius:var(--raio); max-width:340px; width:90%; }
</style>
</head>
<body>
  <header class="topo"><div class="marca"><img src="../img/logo.png" class="logo-icone" alt="Boralá Tche">Agenda</div></header>

  <div id="avisoAgenda"></div>

  <div class="cal-header">
    <button id="prevMes">←</button>
    <h3 id="mesAno"></h3>
    <button id="nextMes">→</button>
  </div>

  <div id="gridDias"></div>

  <h3 style="padding:16px 20px 0" id="dataSelecionada"></h3>
  <div id="listaHorarios"></div>

  <div id="modalAgendamento" class="hidden">
    <div id="modalBody"></div>
    <button id="fecharModal" style="position:fixed;top:20px;right:20px;background:var(--cuia);border-radius:50%;width:36px;height:36px">✕</button>
  </div>

  <div id="app-nav"></div>

  <script type="module" src="../js/nav.js"></script>

  <script type="module" src="../js/agenda.js"></script>
</body>
</html>
